<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <base href="../../../src/">
    <title>Cafefe · Tests de Componentes de Pedido</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f6efe6;
            color: #3e2723;
            padding: 2rem;
            margin: 0;
        }
        h1 { margin-top: 0; font-size: 1.4rem; }
        .resumen {
            padding: 1rem 1.25rem;
            border-radius: 10px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }
        .resumen.exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .resumen.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .suite {
            background: #ffffff;
            border: 1px solid #d8c6a8;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
        }
        h2 {
            margin: 0 0 0.75rem 0;
            font-size: 1.05rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.45rem;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 4px 0; font-size: 0.92rem; }
        li.ok { color: #1e7e34; }
        li.fail { color: #c8322b; font-weight: 700; }
        pre {
            background: #fff5f5;
            padding: 8px;
            border-radius: 6px;
            font-weight: 400;
            white-space: pre-wrap;
            margin: 4px 0 0 0;
        }
        #sandbox {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>
<body>
    <h1>Suite de Pruebas · Componentes de Pedido (Cliente / Toma de Orden)</h1>
    <div id="resultados"></div>
    <div id="sandbox"></div>

    <script type="module" src="../test/componentes/suite_pedido.js"></script>
</body>
</html>
